[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "water-quality-prediction"
version = "1.0.0"
description = "Audited surface-water index emulation with XGBoost and PyTorch"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scikit-learn>=1.7,<1.8",
  "xgboost>=3.1,<3.2", "torch>=2.9,<2.10", "matplotlib>=3.9,<4", "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
notebook = ["ipykernel>=6,<8", "nbclient>=0.10,<1", "nbformat>=5,<6"]
demo = ["streamlit>=1.40,<2"]
submission = ["reportlab>=4,<6", "pypdf>=5,<7"]

[project.scripts]
water-quality = "water_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
