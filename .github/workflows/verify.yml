name: Verify project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tested environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Check code and saved models
        run: |
          ruff check src tests scripts app.py
          python -m pytest -q
          python -m water_quality predict --input examples/measurements.csv --output /tmp/predictions.csv
          python scripts/verify_submission.py --skip-raw
